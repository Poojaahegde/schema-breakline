name: Contract gate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check incoming events
        run: python3 contract_guard.py --contract contract.json --input incoming/latest.jsonl --output reports
      - name: Keep decision report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-report
          path: reports/
          if-no-files-found: ignore
